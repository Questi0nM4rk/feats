# Publishes @questi0nm4rk/feats to npm when a v* tag is pushed.
# Auth is npm trusted publishing (OIDC): no npm token, no secret. The package's
# trusted publisher on npmjs.com is registered with this file name, release.yml,
# and is stage-only. The version goes to the npm stage queue; a maintainer
# approves it on npmjs.com (2FA) before it is live.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build
        run: |
          bun run build
          bun run build:types

      - name: Test
        run: bun test

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@^11.15.0 # npm stage needs npm 11.15.0 or newer

      - name: Stage on npm
        run: npm stage publish --tag beta --access public --provenance
