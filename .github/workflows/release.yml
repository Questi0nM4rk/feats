# Publishes @questi0nm4rk/feats to npm when a v* tag is pushed.
# Auth is npm trusted publishing (OIDC): no npm token, no secret. The package's
# trusted publisher on npmjs.com is registered with this file name, release.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r '.version' package.json)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Build
        run: |
          bun run build
          bun run build:types

      - name: Test
        run: bun test

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm 11.5.1 or newer
        # Trusted publishing needs npm 11.5.1 or newer; install latest only when the bundled npm is older.
        run: |
          if [ "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n1)" != "11.5.1" ]; then
            npm install -g npm@latest
          fi
          npm --version

      - name: Publish
        run: npm publish --access public --provenance
